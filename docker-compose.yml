services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blog}
      MYSQL_USER: ${MYSQL_USER:-blog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-blogsecret}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p$${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: ${PORT:-8080}
      APP_ENV: ${APP_ENV:-production}
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: ${MYSQL_USER:-blog}
      DB_PASSWORD: ${MYSQL_PASSWORD:-blogsecret}
      DB_NAME: ${MYSQL_DATABASE:-blog}
      DATABASE_URL: mysql://${MYSQL_USER:-blog}:${MYSQL_PASSWORD:-blogsecret}@tcp(db:3306)/${MYSQL_DATABASE:-blog}?multiStatements=true
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-60}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
