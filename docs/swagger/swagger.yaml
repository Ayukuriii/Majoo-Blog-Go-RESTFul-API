        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/blog-api_internal_response.MessageEnvelope'
      summary: Get a post
      tags:
      - posts
    patch:
      consumes:
      - application/json
      parameters:
      - description: Post public_id (UUID v7)
        in: path
        name: publicId
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_post.UpdatePostRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/blog-api_internal_response.DataEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_post.PostResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/blog-api_internal_response.MessageEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/blog-api_internal_response.MessageEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/blog-api_internal_response.MessageEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/blog-api_internal_response.MessageEnvelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/blog-api_internal_response.ValidationEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/blog-api_internal_response.MessageEnvelope'
      security:
      - BearerAuth: []
