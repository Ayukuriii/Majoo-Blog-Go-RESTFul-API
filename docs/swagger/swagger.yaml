        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/blog-api_internal_response.MessageEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/blog-api_internal_response.MessageEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/blog-api_internal_response.MessageEnvelope'
      security:
      - BearerAuth: []
      summary: Delete a post
      tags:
      - posts
    get:
      parameters:
      - description: Post public_id (UUID v7)
        in: path
        name: publicId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/blog-api_internal_response.DataEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_post.PostResponse'
              type: object
        "404":
